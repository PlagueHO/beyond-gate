name: Feature request or implementation
description: Request new product behavior or plan one coherent part of the Beyond Gate roadmap.
title: ""
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a new feature or roadmap implementation.
        Use Bug report for an observable failure, Chore for maintenance,
        or Documentation for documentation-only changes.
        Use synthetic data only. Do not include credentials, private account
        data, private URLs, or proprietary content.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the user result and current gap.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State included work, excluded work, and unresolved decisions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use measurable checks. Do not imply that account access permits automation.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and order
      description: Link prerequisites or write None. State whether a feasibility decision is needed.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Tests and documentation
      description: Define offline tests and affected documentation. Never attach real account data.
    validations:
      required: true

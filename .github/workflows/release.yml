name: Release packaging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "README.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "docs/installation.md"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: pwsh
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select repository toolchain
        run: rustup show
      - name: Ensure Visual Studio 2022 Build Tools
        if: runner.os == 'Windows'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -version '[17.0,18.0)' -products Microsoft.VisualStudio.Product.BuildTools -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect Visual Studio installations." }
          if (!$installation) {
            choco install visualstudio2022buildtools --yes --no-progress --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart"
            if ($LASTEXITCODE -notin @(0, 3010)) { throw "Visual Studio 2022 Build Tools installation failed." }
          }
          exit 0
      - name: Check package version and tag
        id: package
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          $metadata = & ./scripts/cargo.ps1 metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read Cargo metadata." }
          $versions = @($metadata.packages.version | Select-Object -Unique)
          if ($versions.Count -ne 1) { throw "Workspace package versions must match." }
          $version = $versions[0]
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "The tag must equal v$version."
          }
          $hostLine = rustc -vV | Select-String "^host: (.+)$"
          if ($LASTEXITCODE -ne 0 -or !$hostLine) { throw "Cannot identify the Rust host." }
          $target = $hostLine.Matches[0].Groups[1].Value
          if ($target -cne $env:EXPECTED_TARGET) { throw "Expected $env:EXPECTED_TARGET, found $target." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "target=$target" >> $env:GITHUB_OUTPUT
      - run: ./scripts/cargo.ps1 fmt --all -- --check
      - run: ./scripts/cargo.ps1 clippy --workspace --all-targets --locked '--' -D warnings
      - run: ./scripts/cargo.ps1 test --workspace --locked
      - run: ./scripts/cargo.ps1 test --workspace --doc --locked
      - run: ./scripts/cargo.ps1 doc --workspace --no-deps --document-private-items --locked
      - run: ./scripts/cargo.ps1 build --release --workspace --locked
      - name: Record native runtime dependencies
        run: |
          if ($IsWindows) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $installation = & $vswhere -latest -version '[17.0,18.0)' -products Microsoft.VisualStudio.Product.BuildTools -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or !$installation) { throw "Visual Studio 2022 Build Tools was not found." }
            $developerOutput = & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
            $developerShellSucceeded = $?
            $developerOutput | Out-Host
            if (!$developerShellSucceeded) { throw "Visual Studio 2022 environment setup failed." }
          }
          foreach ($name in @("beyond-gate", "beyond-gate-mcp")) {
            $suffix = if ($IsWindows) { ".exe" } else { "" }
            $binary = Join-Path (Join-Path target release) "$name$suffix"
            if ($IsWindows) { & dumpbin /DEPENDENTS $binary }
            elseif ($IsLinux) { & ldd $binary }
            else { & otool -L $binary }
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $name native dependencies." }
          }
      - name: Package native binaries and checksums
        env:
          VERSION: ${{ steps.package.outputs.version }}
          TARGET: ${{ steps.package.outputs.target }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path package, dist | Out-Null
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          foreach ($name in @("beyond-gate", "beyond-gate-mcp")) {
            $binary = Join-Path (Join-Path target release) "$name$suffix"
            & $binary --version
            if ($LASTEXITCODE -ne 0) { throw "$name version check failed." }
            & $binary --help
            if ($LASTEXITCODE -ne 0) { throw "$name help check failed." }
            Copy-Item $binary -Destination package
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md -Destination package
          Copy-Item docs/installation.md -Destination package
          $stem = "beyond-gate-v$env:VERSION-$env:TARGET"
          if ($IsWindows) {
            $archive = "$stem.zip"
            Compress-Archive -Path (Join-Path package "*") -DestinationPath (Join-Path dist $archive)
          } else {
            $archive = "$stem.tar.gz"
            tar -czf (Join-Path dist $archive) -C package .
            if ($LASTEXITCODE -ne 0) { throw "Archive creation failed." }
          }
          $hash = (Get-FileHash (Join-Path dist $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content (Join-Path dist "$archive.sha256") -Encoding ascii
          ./scripts/test-package.ps1 -Archive (Join-Path dist $archive) -Checksum (Join-Path dist "$archive.sha256") -Version $env:VERSION -Target $env:TARGET
          ./scripts/test-package-failures.ps1 -Archive (Join-Path dist $archive) -Version $env:VERSION -Target $env:TARGET
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beyond-gate-${{ steps.package.outputs.target }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: beyond-gate-*
          path: dist
          merge-multiple: true
      - name: Prepare draft for maintainer review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          if ($assets.Count -ne 6) { throw "Expected three archives and three checksums." }
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Beyond Gate $env:RELEASE_TAG" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed." }

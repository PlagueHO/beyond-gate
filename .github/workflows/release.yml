name: Release packaging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "src/**"
      - "beyond-gate-browser-extension/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "README.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "docs/installation.md"
      - "docs/desktop-acceptance.md"
      - "docs/testing.md"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.package.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: pwsh
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Windows'
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Select repository toolchain
        run: rustup show
      - name: Check release verification helpers
        run: ./scripts/test-release-provenance.ps1
      - name: Ensure Visual Studio 2022 Build Tools
        if: runner.os == 'Windows'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -version '[17.0,18.0)' -products Microsoft.VisualStudio.Product.BuildTools -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect Visual Studio installations." }
          if (!$installation) {
            winget install --id Microsoft.VisualStudio.2022.BuildTools --exact --source winget --accept-source-agreements --accept-package-agreements --override "--wait --passive --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --norestart"
            if ($LASTEXITCODE -notin @(0, 3010)) { throw "Visual Studio 2022 Build Tools installation failed." }
          }
          exit 0
      - name: Check package version and tag
        id: package
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          $metadata = & ./scripts/cargo.ps1 metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read Cargo metadata." }
          $versions = @($metadata.packages.version | Select-Object -Unique)
          if ($versions.Count -ne 1) { throw "Workspace package versions must match." }
          $version = $versions[0]
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "The tag must equal v$version."
          }
          $hostLine = rustc -vV | Select-String "^host: (.+)$"
          if ($LASTEXITCODE -ne 0 -or !$hostLine) { throw "Cannot identify the Rust host." }
          $target = $hostLine.Matches[0].Groups[1].Value
          if ($target -cne $env:EXPECTED_TARGET) { throw "Expected $env:EXPECTED_TARGET, found $target." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "target=$target" >> $env:GITHUB_OUTPUT
      - run: ./scripts/cargo.ps1 fmt --all -- --check
      - run: ./scripts/cargo.ps1 clippy --workspace --all-targets --locked '--' -D warnings
      - run: ./scripts/cargo.ps1 test --workspace --locked
      - run: ./scripts/cargo.ps1 test --workspace --doc --locked
      - run: ./scripts/cargo.ps1 doc --workspace --no-deps --document-private-items --locked
      - run: ./scripts/cargo.ps1 build --release --workspace --locked
      - name: Record native runtime dependencies
        run: |
          if ($IsWindows) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $installation = & $vswhere -latest -version '[17.0,18.0)' -products Microsoft.VisualStudio.Product.BuildTools -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or !$installation) { throw "Visual Studio 2022 Build Tools was not found." }
            $developerOutput = & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
            $developerShellSucceeded = $?
            $developerOutput | Out-Host
            if (!$developerShellSucceeded) { throw "Visual Studio 2022 environment setup failed." }
          }
          $names = @("beyond-gate", "beyond-gate-mcp")
          if ($IsWindows) { $names += "beyond-gate-native-host" }
          foreach ($name in $names) {
            $suffix = if ($IsWindows) { ".exe" } else { "" }
            $binary = Join-Path (Join-Path target release) "$name$suffix"
            if ($IsWindows) { & dumpbin /DEPENDENTS $binary }
            elseif ($IsLinux) { & ldd $binary }
            else { & otool -L $binary }
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $name native dependencies." }
          }
      - name: Package native binaries and checksums
        env:
          VERSION: ${{ steps.package.outputs.version }}
          TARGET: ${{ steps.package.outputs.target }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path package, dist | Out-Null
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          foreach ($name in @("beyond-gate", "beyond-gate-mcp")) {
            $binary = Join-Path (Join-Path target release) "$name$suffix"
            & $binary --version
            if ($LASTEXITCODE -ne 0) { throw "$name version check failed." }
            & $binary --help
            if ($LASTEXITCODE -ne 0) { throw "$name help check failed." }
            Copy-Item $binary -Destination package
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md -Destination package
          Copy-Item docs/installation.md -Destination package
          if ($IsWindows) {
            Copy-Item target/release/beyond-gate-native-host.exe -Destination package
            $browserStage = Join-Path $env:RUNNER_TEMP "beyond-gate-browser-$([guid]::NewGuid().ToString('N'))"
            & node ./scripts/browser-tests/stage-production-extension.mjs $browserStage
            if ($LASTEXITCODE -ne 0) { throw "Browser extension staging failed." }
            Compress-Archive -Path (Join-Path $browserStage "*") -DestinationPath package/beyond-gate-browser.zip
          }
          $stem = "beyond-gate-v$env:VERSION-$env:TARGET"
          if ($IsWindows) {
            $archive = "$stem.zip"
            Compress-Archive -Path (Join-Path package "*") -DestinationPath (Join-Path dist $archive)
          } else {
            $archive = "$stem.tar.gz"
            tar -czf (Join-Path dist $archive) -C package .
            if ($LASTEXITCODE -ne 0) { throw "Archive creation failed." }
          }
          $hash = (Get-FileHash (Join-Path dist $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content (Join-Path dist "$archive.sha256") -Encoding ascii
          New-Item -ItemType Directory -Path evidence | Out-Null
          ./scripts/test-package.ps1 -Archive (Join-Path dist $archive) -Checksum (Join-Path dist "$archive.sha256") -Version $env:VERSION -Target $env:TARGET -SourceCommit $env:GITHUB_SHA -ReportPath (Join-Path evidence "$env:TARGET.json")
          ./scripts/test-package-failures.ps1 -Archive (Join-Path dist $archive) -Version $env:VERSION -Target $env:TARGET
          "Offline package checks passed. These are unattested test outputs unless this run's provenance job succeeds." >> $env:GITHUB_STEP_SUMMARY
      - name: Retain offline package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-evidence-${{ matrix.target }}
          path: evidence/*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beyond-gate-${{ steps.package.outputs.target }}
          path: dist/*
          if-no-files-found: error

  provenance:
    name: Attest and verify final candidate
    if: github.repository == 'PlagueHO/beyond-gate' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: beyond-gate-*
          path: dist
          merge-multiple: true
      - name: Check final inventory and checksums
        id: assets
        run: |
          $assets = @(./scripts/test-release-assets.ps1 -Directory dist -Version $env:VERSION)
          "subjects<<RELEASE_SUBJECTS" >> $env:GITHUB_OUTPUT
          $assets >> $env:GITHUB_OUTPUT
          "RELEASE_SUBJECTS" >> $env:GITHUB_OUTPUT
      - name: Attest final archives and checksum sidecars
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.subjects }}
          create-storage-record: false
      - name: Verify provenance and reject changed bytes or identity
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path provenance-evidence | Out-Null
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination provenance-evidence/attestation.json
          $assets = @(./scripts/test-release-assets.ps1 -Directory dist -Version $env:VERSION)
          foreach ($asset in $assets) {
            $result = ./scripts/verify-release-provenance.ps1 -Artifact $asset -SourceCommit $env:GITHUB_SHA -SourceRef $env:GITHUB_REF
            $result | Set-Content -LiteralPath (Join-Path provenance-evidence "$([IO.Path]::GetFileName($asset)).verification.json")
          }
          # A negative policy check must not turn a successful verification into a pass.
          function Assert-RejectedAttestation {
            param([string]$Path, [string]$Commit, [string]$Ref, [string]$Workflow)
            & gh attestation verify $Path --bundle $env:ATTESTATION_BUNDLE --repo PlagueHO/beyond-gate --source-digest $Commit --source-ref $Ref --signer-workflow $Workflow --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners *> $null
            if ($LASTEXITCODE -eq 0) { throw 'Invalid artifact or build identity passed provenance verification.' }
          }
          $workflow = 'PlagueHO/beyond-gate/.github/workflows/release.yml'
          $archive = $assets[0]
          $changed = Join-Path $env:RUNNER_TEMP "beyond-gate-tampered-$([guid]::NewGuid().ToString('N'))"
          try {
            Copy-Item -LiteralPath $archive -Destination $changed
            $stream = [IO.File]::Open($changed, [IO.FileMode]::Open, [IO.FileAccess]::ReadWrite)
            try {
              $byte = $stream.ReadByte()
              $stream.Position = 0
              $stream.WriteByte($byte -bxor 1)
            } finally { $stream.Dispose() }
            Assert-RejectedAttestation $changed $env:GITHUB_SHA $env:GITHUB_REF $workflow
            $wrongCommit = if ($env:GITHUB_SHA -ceq ('a' * 40)) { 'b' * 40 } else { 'a' * 40 }
            Assert-RejectedAttestation $archive $wrongCommit $env:GITHUB_REF $workflow
            $wrongRef = if ($env:GITHUB_REF -ceq 'refs/heads/provenance-rejection') { 'refs/heads/provenance-other' } else { 'refs/heads/provenance-rejection' }
            Assert-RejectedAttestation $archive $env:GITHUB_SHA $wrongRef $workflow
            Assert-RejectedAttestation $archive $env:GITHUB_SHA $env:GITHUB_REF 'PlagueHO/beyond-gate/.github/workflows/not-the-release.yml'
            ./scripts/verify-release-provenance.ps1 -Artifact $archive -SourceCommit $env:GITHUB_SHA -SourceRef $env:GITHUB_REF > $null
            'Verified rejection of changed bytes, wrong source commit, wrong ref, and wrong signer workflow.' | Set-Content provenance-evidence/rejections.txt
          } finally {
            if (Test-Path -LiteralPath $changed) { Remove-Item -LiteralPath $changed }
          }
          "Verified final-byte provenance for six candidate assets. This is not Windows publisher signing or macOS notarization." >> $env:GITHUB_STEP_SUMMARY
      - name: Retain provenance evidence separately from release assets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-provenance-evidence
          path: provenance-evidence/*
          if-no-files-found: warn

  draft-release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: beyond-gate-*
          path: dist
          merge-multiple: true
      - name: Prepare draft for maintainer review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $assets = @(./scripts/test-release-assets.ps1 -Directory dist -Version $env:VERSION)
          foreach ($asset in $assets) {
            ./scripts/verify-release-provenance.ps1 -Artifact $asset -SourceCommit $env:GITHUB_SHA -SourceRef $env:GITHUB_REF > $null
          }
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Beyond Gate $env:RELEASE_TAG" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed." }

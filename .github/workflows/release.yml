name: Release packaging

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select repository toolchain
        run: rustup show
      - name: Check package version and tag
        id: package
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read Cargo metadata." }
          $versions = @($metadata.packages.version | Select-Object -Unique)
          if ($versions.Count -ne 1) { throw "Workspace package versions must match." }
          $version = $versions[0]
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "The tag must equal v$version."
          }
          $hostLine = rustc -vV | Select-String "^host: (.+)$"
          if ($LASTEXITCODE -ne 0 -or !$hostLine) { throw "Cannot identify the Rust host." }
          $target = $hostLine.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "target=$target" >> $env:GITHUB_OUTPUT
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo doc --workspace --no-deps --document-private-items --locked
      - run: cargo build --release --workspace --locked
      - name: Package native binaries and checksums
        env:
          VERSION: ${{ steps.package.outputs.version }}
          TARGET: ${{ steps.package.outputs.target }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path package, dist | Out-Null
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          foreach ($name in @("beyond-gate", "beyond-gate-mcp")) {
            $binary = Join-Path (Join-Path target release) "$name$suffix"
            & $binary --version
            if ($LASTEXITCODE -ne 0) { throw "$name version check failed." }
            & $binary --help
            if ($LASTEXITCODE -ne 0) { throw "$name help check failed." }
            Copy-Item $binary -Destination package
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md -Destination package
          $stem = "beyond-gate-v$env:VERSION-$env:TARGET"
          if ($IsWindows) {
            $archive = "$stem.zip"
            Compress-Archive -Path (Join-Path package "*") -DestinationPath (Join-Path dist $archive)
          } else {
            $archive = "$stem.tar.gz"
            tar -czf (Join-Path dist $archive) -C package .
            if ($LASTEXITCODE -ne 0) { throw "Archive creation failed." }
          }
          $hash = (Get-FileHash (Join-Path dist $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content (Join-Path dist "$archive.sha256") -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beyond-gate-${{ steps.package.outputs.target }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: beyond-gate-*
          path: dist
          merge-multiple: true
      - name: Prepare draft for maintainer review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          if ($assets.Count -ne 6) { throw "Expected three archives and three checksums." }
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Beyond Gate $env:RELEASE_TAG" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed." }

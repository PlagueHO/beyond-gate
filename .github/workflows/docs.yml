name: Documentation checks and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: docs/package.json
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Test Pages deployment refusal cases
        run: node --test docs/tests/pages-deployment.test.mjs
      - name: Install locked site dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Build production site
        run: pnpm --dir docs build
      - name: Check production site in Chrome
        run: pnpm --dir docs test
      - name: Build theme comparison
        run: pnpm --dir docs build:themes
      - name: Check all five themes
        env:
          DOCS_TEST_THEMES: "1"
        run: pnpm --dir docs test
      - name: Upload checked production site
        if: >-
          github.repository == 'PlagueHO/beyond-gate' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select repository toolchain
        run: rustup show
      - name: Install pinned Markdown checker
        shell: pwsh
        run: ./scripts/install-doc-tools.ps1
      - name: Check Markdown style
        shell: pwsh
        run: ./scripts/check-docs.ps1 -Mode Style
      - name: Check local links and anchors
        shell: pwsh
        run: ./scripts/check-docs.ps1 -Mode Links
      - name: Test checker failure cases
        shell: pwsh
        run: ./scripts/test-doc-checks.ps1

  deploy:
    name: Deploy checked documentation
    needs: [site, markdown]
    if: >-
      github.repository == 'PlagueHO/beyond-gate' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Pages URL and reject outdated runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pages-deployment.mjs
      - name: Deploy this run's production artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

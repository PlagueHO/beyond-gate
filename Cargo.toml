[workspace]
members = [
    "src/beyond-gate-core",
    "src/beyond-gate-cli",
    "src/beyond-gate-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/PlagueHO/beyond-gate"
publish = false

[workspace.dependencies]
beyond-gate-core = { path = "src/beyond-gate-core" }
clap = "4.6.7"
rmcp = {
    version = "3.8.0",
    default-features = false,
    features = ["macros", "schemars", "server", "transport-io"],
}
schemars = "1.2.3"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

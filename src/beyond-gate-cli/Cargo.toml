[package]
name = "beyond-gate-cli"
description = "Local-first command-line access to authorized D&D Beyond data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "beyond-gate"

[features]
e2e-isolation = ["beyond-gate-core/e2e-isolation"]
pairing-fixture = []

[[example]]
name = "pairing-terminal-fixture"
required-features = ["pairing-fixture"]

[[bin]]
name = "beyond-gate"
path = "src/main.rs"

[[bin]]
name = "beyond-gate-native-host"
path = "src/bin/native_host.rs"

[dependencies]
beyond-gate-core.workspace = true
anstream = "1.0"
base64 = "0.23.1"
clap = { workspace = true, features = ["wrap_help"] }
clap_complete = "4.6"
# The poll-based Unix backend consumes pastes larger than one terminal read buffer.
crossterm = { version = "=0.29.0", default-features = false, features = ["windows", "events", "use-dev-tty"] }
serde_json = "1.0.154"
scraper = { version = "0.27.0", default-features = false }
zeroize = "1.8"
tokio = { version = "1.54.1", features = ["rt", "io-std", "net", "time", "signal", "macros"] }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", features = ["transactions"] }

[dev-dependencies]
beyond-gate-core = { workspace = true, features = ["session-fixture"] }
portable-pty = "=0.9.0"

[[test]]
name = "hidden_terminal"
path = "tests/hidden_terminal.rs"
harness = false

[[test]]
name = "adapter_process"
path = "tests/adapter_process.rs"
harness = false

[lints]
workspace = true

[package]
name = "beyond-gate-core"
description = "Shared operations for the Beyond Gate CLI and MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
e2e-isolation = []

[[example]]
name = "e2e-session"
required-features = ["e2e-isolation"]

[dependencies]
base64 = "0.23.1"
httpdate = "1.0.3"
keyring-core = "1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time"] }
zeroize = "1.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[lints]
workspace = true
